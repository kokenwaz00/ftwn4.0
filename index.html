<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Preloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .preloader {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Green glowing block */
    .green-block {
      width: 80px;
      height: 80px;
      background: #01FF81;
      border-radius: 16px;
      margin-bottom: 40px;
      box-shadow: 
        0 0 20px #01FF81,
        0 0 40px #01FF81,
        0 0 80px rgba(1, 255, 129, 0.4);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }

    /* Trump + Musk themed row */
    .themes {
      display: flex;
      gap: 48px;
      margin-bottom: 36px;
      align-items: center;
    }

    .theme-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .theme-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #0a0a0a;
      position: relative;
    }

    .theme-icon.trump {
      background: linear-gradient(135deg, #ff6b35, #f7c59f);
      box-shadow: 0 0 18px rgba(255, 107, 53, 0.5);
    }

    .theme-icon.musk {
      background: linear-gradient(135deg, #00d4ff, #7b2cbf);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.5);
    }

    .theme-label {
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Main text */
    .preloader-text {
      color: #ffffff;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-align: center;
      margin-bottom: 32px;
    }

    /* Loading bar */
    .loading-bar {
      width: 180px;
      height: 3px;
      background: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar-inner {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #01FF81;
      border-radius: 4px;
      box-shadow: 0 0 12px #01FF81;
      animation: loading 1.4s ease-in-out infinite;
    }

    @keyframes loading {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    /* Small helper text */
    .helper {
      position: absolute;
      bottom: 40px;
      color: #444;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="preloader" id="preloader">
    <div class="green-block"></div>

    <div class="themes">
      <div class="theme-item">
        <div class="theme-icon trump">T</div>
        <div class="theme-label">Trump</div>
      </div>
      <div class="theme-item">
        <div class="theme-icon musk">M</div>
        <div class="theme-label">Musk</div>
      </div>
    </div>

    <div class="preloader-text">The Leading Blockchain Casino</div>

    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>

    <div class="helper">Loading...</div>
  </div>

  <script>
    // Hide preloader after 2.8 seconds (demo)
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("preloader").classList.add("hidden");
      }, 2800);
    });
  </script>

</body>
</html>
